server:
  port: ${APPOINTMENT_SERVICE_PORT:8084}
spring:
  application:
    name: appointment-service
  datasource:
    url: ${APPOINTMENT_DB_URL:jdbc:postgresql://localhost:5432/medflow_appointment}
    username: ${APPOINTMENT_DB_USER:medflow_appointment}
    password: ${APPOINTMENT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt:
    secret: ${JWT_SECRET}
