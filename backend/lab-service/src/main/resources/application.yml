
server:
  port: ${LAB_SERVICE_PORT:8086}

spring:
  application:
    name: lab-service

  datasource:
    url: ${LAB_DB_URL:jdbc:postgresql://localhost:5432/medflow_lab}
    username: ${LAB_DB_USER:medflow_lab}
    password: ${LAB_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

  health:
    db:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
