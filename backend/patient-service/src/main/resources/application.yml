
spring:
  application:
    name: patient-service

  datasource:
    url: ${PATIENT_DB_URL:jdbc:postgresql://localhost:5432/medflow_patient}
    username: ${PATIENT_DB_USER:medflow_patient}
    password: ${PATIENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PATIENT_SERVICE_PORT:8082}

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false

  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: medflow-auth
