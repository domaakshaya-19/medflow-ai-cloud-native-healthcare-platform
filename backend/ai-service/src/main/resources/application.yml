server:
  port: ${AI_SERVICE_PORT:8093}
  error:
    include-message: never
spring:
  application:
    name: ai-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
app:
  jwt:
    secret: ${JWT_SECRET}
  gateway: ${API_GATEWAY_URL:http://localhost:8080}
  gemini-key: ${GEMINI_API_KEY:}
  gemini-model: ${GEMINI_MODEL:gemini-3.8-flash}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
