
server:
  port: ${PRESCRIPTION_SERVICE_PORT:8087}

spring:
  application:
    name: prescription-service

  datasource:
    url: ${PRESCRIPTION_DB_URL:jdbc:postgresql://localhost:5432/medflow_prescription}
    username: ${PRESCRIPTION_DB_USER:medflow_prescription}
    password: ${PRESCRIPTION_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
