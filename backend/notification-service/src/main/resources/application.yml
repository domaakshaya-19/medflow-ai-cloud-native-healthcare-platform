server:
  port: ${NOTIFICATION_SERVICE_PORT:8092}
  error:
    include-message: never
spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/medflow_notification}
    username: ${NOTIFICATION_DB_USER:medflow_notification}
    password: ${NOTIFICATION_DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
app:
  jwt:
    secret: ${JWT_SECRET}
  gateway: ${API_GATEWAY_URL:http://localhost:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
